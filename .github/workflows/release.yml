name: Build and Release ASME B31.8 Designer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v3.8.0)"
        required: true
        default: "v3.8.0"

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Pytest Suite
        run: |
          pytest -v

  build-windows:
    name: Build Windows x64 Executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Executable (Anti-Malware Safe)
        run: |
          python build_exe.py
          python build_exe.py --mode=onedir

      - name: Package Windows Release Artifacts
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if (-not $ver -or -not ($ver -like 'v*')) { $ver = '${{ inputs.version }}' }
          if (-not $ver) { $ver = 'v3.8.0' }
          $v = $ver.TrimStart('v')

          # --- 1) Tek dosya .exe (surumlu ad) ---
          $exeName = "ASME_Branch_Connection_v${v}_Windows_x64.exe"
          Move-Item -Force dist/ASME_Branch_Connection_V3.exe $exeName
          $exeHash = (Get-FileHash -Path $exeName -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $exeName" | Out-File -Encoding ascii "${exeName}.sha256"

          # --- 2) AV dostu onedir portable zip ---
          $zipName = "ASME_Branch_Connection_v${v}_Windows_x64_Portable.zip"
          Compress-Archive -Path dist/ASME_Branch_Connection_V3_onedir/*, README.md -DestinationPath $zipName
          $zipHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zipName" | Out-File -Encoding ascii "${zipName}.sha256"

          Get-ChildItem -Path . -Filter "ASME_Branch_Connection_v*" | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ASME_Branch_Connection_v*_Windows_x64.exe
            ASME_Branch_Connection_v*_Windows_x64.exe.sha256
            ASME_Branch_Connection_v*_Windows_x64_Portable.zip
            ASME_Branch_Connection_v*_Windows_x64_Portable.zip.sha256

  build-macos:
    name: Build macOS Apple Silicon (ARM64)
    needs: test
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Native ARM64 Binary
        run: |
          python3 build_exe.py
          chmod +x dist/ASME_Branch_Connection_V3

      - name: Package macOS Apple Silicon DMG
        run: |
          VER="${{ github.ref_name }}"
          if [[ -z "$VER" || "$VER" != v* ]]; then
            VER="${{ inputs.version }}"
          fi
          if [[ -z "$VER" ]]; then
            VER="v3.8.0"
          fi
          V="${VER#v}"

          APP_SRC="dist/ASME_Branch_Connection_V3.app"
          APP_NAME="ASME_Branch_Connection_v${V}.app"
          STAGE="dmg-stage"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          if [ -d "$APP_SRC" ]; then
            cp -R "$APP_SRC" "$STAGE/$APP_NAME"
          else
            # .app uretilmemisse cikti binary'sini uygulama klasorune koy
            mkdir -p "$STAGE/$APP_NAME"
            cp "dist/ASME_Branch_Connection_V3" "$STAGE/$APP_NAME/"
          fi

          # /Applications kisayolu (surukle-birak kurulum)
          ln -s /Applications "$STAGE/Applications"

          # Kullanim notu
          cat > "$STAGE/README.txt" << 'READMEEOF'
          ASME B31.8 Pipeline Designer — macOS Kurulum
          ============================================

          1) Uygulamayi Applications klasorune surukleyin.
          2) Ilk acilista macOS "tanimlanamayan gelistirici" uyarisi verebilir
             (uygulama imzasiz/notarize edilmemistir).
             Cozum: uygulamaya sag tik -> "Ac" -> "Ac" secin,
             VEYA bu klasordeki "First launch (macOS).command" dosyasini
             cift tiklayarak karantinayi temizleyin.
          3) Terminal ile acmak isterseniz:
             xattr -dr com.apple.quarantine "/Applications/ASME_Branch_Connection_v__VERSION__.app"

          READMEEOF
          sed -i '' "s/__VERSION__/${V}/g" "$STAGE/README.txt"

          # Ilk acilis yardimcisi (karantina temizligi + acma)
          cat > "$STAGE/First launch (macOS).command" << 'LAUNCHEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP="ASME_Branch_Connection_v__VERSION__.app"
          xattr -dr com.apple.quarantine "$DIR/$APP" 2>/dev/null || true
          xattr -dr com.apple.quarantine "/Applications/$APP" 2>/dev/null || true
          if [ -d "/Applications/$APP" ]; then
            open "/Applications/$APP"
          else
            open "$DIR/$APP"
          fi
          LAUNCHEOF
          sed -i '' "s/__VERSION__/${V}/g" "$STAGE/First launch (macOS).command"
          chmod +x "$STAGE/First launch (macOS).command"

          # Ad-hoc imza (Gatekeeper icin; notarization yok)
          if [ -d "$STAGE/$APP_NAME" ]; then
            codesign --force --deep --sign - "$STAGE/$APP_NAME" || true
          fi

          DMG_NAME="ASME_Branch_Connection_v${V}_macOS_AppleSilicon_ARM64.dmg"
          hdiutil create \
            -volname "ASME B31.8 Designer ${VER}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG_NAME"

          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"
          ls -lh "$DMG_NAME"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            ASME_Branch_Connection_v*_macOS_AppleSilicon_ARM64.dmg
            ASME_Branch_Connection_v*_macOS_AppleSilicon_ARM64.dmg.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p final-release
          find release-artifacts -type f \( -name "*.zip*" -o -name "*.exe*" -o -name "*.dmg*" \) -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Remove Obsolete Assets (eski zip formati)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" != v* ]]; then
            TAG="${{ inputs.version }}"
          fi
          if [[ -z "$TAG" ]]; then
            TAG="v3.8.0"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG bulunamadi, temizlik atlandi."
            exit 0
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *_Windows_x64.zip|*_Windows_x64.zip.sha256|*_macOS_AppleSilicon_ARM64.zip|*_macOS_AppleSilicon_ARM64.zip.sha256)
                gh release delete-asset "$TAG" "$name" -y && echo "Silindi (eski format): $name" ;;
            esac
          done

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" != v* ]]; then
            TAG="${{ inputs.version }}"
          fi
          if [[ -z "$TAG" ]]; then
            TAG="v3.8.0"
          fi

          cat << 'EOF' > release_notes.md
          # 🚀 ASME B31.8 Pipeline Branch Connection Design Tool

          Uluslararası petrol ve doğalgaz boru hattı standartlarına (**ASME B31.8-2025**, **API 5L**, **API RP 2201**, **MSS SP-97**, **NACE MR0175 / ISO 15156**) tam uyumlu branşman tasarım, alan telafisi ve karar matrisi doğrulama aracı.

          ### 📦 İndirilebilir Paketler (Downloads):
          * **Windows 10 / 11 (x64) — Tek dosya**: `ASME_Branch_Connection___TAG___Windows_x64.exe` (portable `.exe`)
          * **Windows 10 / 11 (x64) — Portable (AV dostu)**: `ASME_Branch_Connection___TAG___Windows_x64_Portable.zip` (klasör çıktı; antivirüs yanlış pozitifleri için önerilir)
          * **macOS Apple Silicon (M1 / M2 / M3 / M4 - ARM64)**: `ASME_Branch_Connection___TAG___macOS_AppleSilicon_ARM64.dmg`
          * Tüm dosyaların yanında `.sha256` doğrulama dosyaları bulunur.

          ### 🔐 İmzalama / Güvenlik Notu:
          * Bu sürüm **kod imzalama sertifikası olmadan** üretilmiştir. Windows SmartScreen/antivirüs ve macOS Gatekeeper ilk açılışta uyarı verebilir.
          * **Windows:** `.exe` yerine AV hassas ortamlarda `..._Portable.zip` sürümünü tercih edin.
          * **macOS:** DMG içindeki `README.txt` ve `First launch (macOS).command` dosyaları ilk açılış adımlarını içerir (karantina temizliği).
          * Derleme anti-malware dostudur: UPX kapalı, sürüm bilgisi + uygulama manifesti (asInvoker) gömülü.

          ### 📦 Dosya Adlandırma:
          Tüm paketler sürüm numarasını içerir: `ASME_Branch_Connection_<tag>_<platform>.<uzanti>`

          ### ✨ V3.8.0 Yenilikleri:
          * **Mimari — Raporlama Katmanı:** `generate_html_report` motordan çıkarıldı; HTML ve PDF üreticileri bağımsız **`reporting/`** paketinde (`reporting/html.py`, `reporting/pdf.py`). `engine` artık yalnızca ince bir sarmalayıcı içerir; geriye uyumluluk korunur.
          * **i18n (Türkçe / İngilizce):** `locales/tr.json` + `locales/en.json` sözlükleri ve `i18n.py` (`t()`); sidebar'dan dil seçimi. Eksik anahtar otomatik olarak Türkçe'ye düşer.
          * **Kapsam:** 388 test.

          ### ✨ V3.7.0 Yenilikleri:
          * **Tema Seçici:** Sidebar'dan Açık / Koyu / Sistem teması ve vurgu rengi seçimi; merkezî CSS katmanı (`rec-card`, `highlight-box` sınıfları) eklendi.
          * **Normatif Düzeltmeler:** Fig. I-1.1-3 Note (1) uyarınca tam kuşatma (split tee/sleeve) altında boru metali takviye sayılmaz → **A1 = 0**; Para 831.4.1(l) **85° kuralı** (β<85° bireysel mühendislik çalışması); MSS SP-97 **d/D > 0.5** için muafiyet otomatik onaylanmaz, "ek mühendislik değerlendirmesi gerekli" statüsüne düşürülür; manşon efektif uzunluğunda fiziksel açıklık branşman OD'si ile alınır.
          * **Kloz Referansları:** Karar matrisi ve kloz açıklamaları ASME B31.8-2025 gerçek 831.4.2 lettering'ine göre düzeltildi (uydurma başlıklar kaldırıldı).
          * **Birim Sistemi:** Imperial seçiminde basınç (psi), sıcaklık (°F) ve korozyon payı (in) dönüştürülür; sonuç metrikleri in/in² olarak gösterilir (motor daima metric hesaplar).
          * **Akış/UI:** Analiz sonrası **3. adım** (temiz sonuç & raporlama ekranı, "Yapılandırmayı Düzenle"); HTML+PDF için **tek metadata kartı**; manuel güncelleme kontrolünde toast bildirimi; teknik girdiler ana ekrana taşındı (sidebar sadeleştirildi).
          * **CAD/Rapor:** 2D kesite olet/sockolet/welding tee profilleri + WT_h/WT_b/T_p ölçü okları; raporlara harici bağımlılık olmadan **SVG (HTML)** ve **vektör çizim (PDF)** gömülür.
          * **Kapsam:** 382 test.

          ### ✨ V3.6.1 Yenilikleri:
          * **Güncelleme Kontrolü:** Uygulama açılışta (opt-out) GitHub Releases üzerinden yeni sürümü kontrol eder; sidebar'da "🔄 Güncelleme" bölümünde sürüm notları ve platforma uygun (Windows x64 / macOS ARM64) indirme linki sunulur. Sürüm bilgisi tek kaynaktan (`version.py`) yönetilir.
          * **Alan Zonu Düzeltmesi:** Branşman artı alanı (A2) artık etkin takviye zonu yüksekliği **L_eff = min(L₁, L₂)** içinde hesaplanıyor (negatif alan 0'a kırpılır).
          * **Sayısal Hesap Detayları:** A1/A2/A3/A4 ve takviye bölge limitleri, UI (`Hesap Detayları` expander), HTML rapor ve PDF'te **formül + sayısal ikame** olarak gösterilir.
          * **PDF Türkçe Karakter Desteği:** ReportLab varsayılan fontu yerine Unicode TTF (Arial/DejaVu) kaydedilir; ş/ğ/İ/ı artık bozulmaz.
          * **Kapsam:** 369 test.

          ### ✨ V3.6.0 Yenilikleri — Profesyonel Düzey Düzeltmeler (P0–P2):

          #### P0 — Kritik Malzeme ve Karşılaştırma Düzeltmeleri
          * **Duplex A815 Desteği:** Duplex boru (S31803/S32205/A790) artık yanlışlıkla `ASTM A403 WP316L` yerine **`ASTM A815 WPS31803/WPS32205` (SMYS 450 MPa, doğru alaşım ailesi)** ile eşleşiyor. Katalog `ASTM A815` (WPS31803/WPS32205) ile genişletildi.
          * **Malzeme Karşılaştırma Eşleşmesi:** `get_fitting_details`teki ters eşleşme (`key in mat_std` → `key == mat_std or key.startswith(mat_std + " ")`) düzeltildi; standard adıyla çağrıldığında da mukavemet/CE/tokluk analizi üretiliyor. Artık **fitting formunda** anında **“Boru vs Fitting Uyumluluk Analizi”** expander’ı görüntüleniyor.

          #### P1 — Malzeme Parse ve Hesap Kesinliği
          * **API 5L PSL 2 Grade B → WPHY 42:** Grade B boş-digits varsayımı “52” yerine muhafazakar **“42”** olarak düzeltildi.
          * **Çok kelimeli grade parse’ı:** `parse_fitting_spec_label` artık katalog önekleriyle eşleşiyor (`WPHY 52`, `LF2 Class 1`, `WPS32205`); otomatik malzeme önerisi dropdown’a doğru yansıyor. Düşük sıcaklık için `ASTM A350 LF2 Class 1` (katalog anahtarıyla eşleşik).
          * **A1/A2 Zon Limitleri:** Branşman fazlalığı, etkin takviye zonu yüksekliği **L_eff = min(L₁, L₂)** (L₁ = 2.5·wt_h_net, L₂ = 2.5·wt_b_net + T_s) içinde hesaplanıyor; A1 ayrıca d_opening ile sınırlıdır. Tam kuşatma (sleeve) yolunda Appendix F `L_zone = min(2.5·T_h, 2.5·T_b + t_sleeve)` kullanılır (lisanslı B31.8 kopyası ile doğrulayın).
          * **Muafiyet Tutarlılığı:** Muaf fitting’te A1/A2/A3/A4/**A_avail/W_p** artık **0**’a çekiliyor; muafiyet mesajı tipe göre ayrıştırıldı (split tee/sleeve → T_sleeve doğrulaması, olet → MSS SP-97, diğer → burst-test).
          * **Hot Tap Gerçek CE:** `0.38` sabiti yerine **gerçek boru kimyasından CE_IIW** hesaplanıyor.
          * **>232 °C Tasarım Durdurma:** `T = 0.0 + "DURDURULMALIDIR"` ve `evaluate_decision_matrix` **FAIL** (sürünme kapsam dışı).

          #### P2 — Profesyonelleşme ve Raporlama
          * **Takviyesiz Fabricated Branch:** `d/D > 0.5` veya `Need_Reinf` iken **uyarı** (Para 831.4.1 sınırları).
          * **Konum Sınıfına Göre Hidrotest:** `get_hydrotest_factor()` → Class 1: **1.10**, Class 2: **1.25**, Class 3/4: **1.40**.
          * **Alan Metodu Varsayımları:** A1/A2 zon ayrımı, f_branch, A3 fillet-only, açılı A2 için ek sinβ gerekmemesi **Assumptions**’a eklendi.
          * **Clause vs Heuristik Ayrımı:** HTML/PDF raporlara **“Uygunluk Bildirimi”** eklendi (lisanslı standart doğrulaması, repo yorumu heuristik işaretleri).
          * **Kapsam:** 334 test, %94 kapsam, tüm modüller derlenebilir ve uygulama sorunsuz içe aktarılır.

          ### ✨ V3.5 Yenilikleri ve Geliştirmeler:
          * **Hot Tap P_safe Derating (API RP 2201 / Battelle)**: Canlı hat kaynağı sırasında güvenli maksimum işletme basıncı `P_safe = 2×S×F×E×T×(t_net−d_pen)/D`; elektrot penetrasyonu (`d_pen`), efektif kalan et kalınlığı (`t_eff`), basınç düşürme (derating) oranı ve PASS/FAIL kontrolü.
          * **Hot Tap Akış (Heat Sink) Termal Analizi**: Akış hızı ve akışkan tipine göre soğuma hızı, burn-through ve HIC (HICC) risk sınıflandırması (Gaz ~1.5–15 m/s, Sıvı ~0.4–2.5 m/s).
          * **Split Tee / Full Encirclement Sleeve Doğrulaması (ASME B31.8-2025)**: Complete encirclement alan yöntemi (Appendix F, Fig. F-2.1.5-1) ve basınçlı hot tap tee manşonu uç kaynak/uç yüz tasarımı (Para 831.4.2(j), Fig. I-1.1-4).
          * **Genişletilmiş Malzeme Kataloğu (Split Tee / Sleeve / Boru)**:
            * **EN 10028-2**: P235GH, P265GH, P295GH, P355GH (yüksek sıcaklık sacı)
            * **EN 10028-3**: P275NL1/NL2, P355N/NH/NL1/NL2, P460N/NH/NL1/NL2 (ince taneli sac)
            * **EN 10028-6**: P500Q, P690Q/QL1 (su verilmiş temperlenmiş)
            * **EN 10208-2**: L245NB – L555MB (hat borusu) & **EN 10216-1/2** (dikişsiz boru)
            * **ASTM A516** Gr 60/65/70 & **ASTM A537** Cl 1/2 (basınçlı kap sacı)
          * **Fitting'e Göre Özelleştirilmiş 3D CAD**: Seçilen fitting tipine göre 3D modelde olet gövdesi (WELDOLET/OLET), fabrika tee boyun yakası (WELDING TEE), full encirclement manşon + boyuna kaynak (SPLIT TEE/SLEEVE) görüntülenir.
          * **Raporlama**: HTML + PDF hesap föyüne Hot Tap güvenlik & basınç analizi ve Split Tee doğrulama bölümleri eklendi.
          * **Kapsam**: 305 otomatik test, %94 kod kapsamı.

          ### ✨ V3.4 Yenilikleri ve Geliştirmeler:
          * **Modüler Mimari (Faz 2)**: `engine.py` (1996 satıra indirildi) — saf hesap motoru `engine_math.py`'ye taşındı, geriye uyumlu re-export. Tip güvenli **dataclass kontratları** (`engine_contracts.py`: `PipeSpecification`, `DesignFactors`, `DesignInput`).
          * **Açılı Bağlantı FEA Uyarısı**: β < 45° girildiğinde ASME B31.8 Para 831.4.1(b) kapsamında **kritik mühendislik uyarısı** (FEA / özel takviyeli tasarım önerisi) + Clause trace + Final Action. UI alt sınırı 30°'ye düzeltildi (engine ile tutarlı).
          * **H₂S Sour Service Otomasyonu**: H₂S ppm girdisi → **p_H₂S = P × ppm × 10⁻⁶** → Region 0/1/2/3 sınıflandırması (NACE MR0175 / ISO 15156) ve otomatik sour aktivasyonu.
          * **Hot Tap Kaynak Desteği**: API 1104 Annex B ön ısıtma & azami ısı girdisi (kJ/mm) + Cutter vs Branch ID geometrik çakışma kontrolü.
          * **SIF Modülü**: Branşman için düzlem içi (ii) / dışı (io) gerilme yoğunlaşma faktörü + opsiyonel harici yüklerle **Von Mises birleşik gerilme** kontrolü.
          * **Birim Sistemi (Metric/Imperial)**: `units.py` ile mm/MPa/°C ↔ in/psi/°F anlık dönüşüm ve arayüz geçişi.
          * **What-If Karşılaştırması**: Birden fazla senaryonun yan yana karşılaştırıldığı yeni tab (A_req, A_avail, takviye durumu vb.).
          * **Resmi PDF Hesap Föyü**: `report_pdf.py` (ReportLab) — dinamik kapak, revizyon geçmişi, mühendislik onay bloğu ve firma logosu ile tek tıkla **PDF** indirme.
          * **Fitting Kataloğu**: ASME B16.9 / B16.11 / MSS SP-75 et kalınlığı tolerans ve yaklaşık ağırlık kataloğu.
          * **Kapsam**: 283 otomatik test, %95 kod kapsamı.

          ### ✨ Önceki Sürümler (V3.3):
          * **ASME B31.8 Standart Faktörleri**:
            * Tablo 841.1.8-1 Sıcaklık Düşürme Faktörü ($T$) otomatik interpolasyonu.
            * Tablo 841.1.7-1 Boyuna Dikiş Faktörü ($E_h$ ve $E_b$) bağımsız seçimi.
            * Tablo 841.1.6-1 & Para 841.1.9 Konum Sınıfı (Class 1-4) ve Tesis Tipi ($F$) limitleri.
            * Hadde İmalat Toleransı (API 5L %12.5) ve Nominal vs Minimum Kalınlık Bazı Analizi.
          * **Geometri, Kaynak & Güvenlik**:
            * Açılı (Lateral $45^\circ \le \beta \le 90^\circ$) Branşman Alan Telafisi.
            * ASME B31.8-2025 Fig. I-1.1-1 Kaynak Bacağı ($W_1 = 3B/8$, min 6.35 mm) ve Boğaz Denetimleri.
            * API RP 2201 Hot Tap Yanma (Burn-through) Güvenlik Uyarısı.
            * Otomatik Takviye Pedi Boyutlandırma Motoru (Auto-Size Pad).
            * ASME B31.8 Para 841.3.2 Hidrostatik Saha Testi Analizi.
          * **Görselleştirme, Metalurji & Raporlama**:
            * Dinamik 2D Ölçekli Kesit Çizimi (Plotly - $A_1, A_2, A_3, A_4$ renklendirilmiş).
            * NACE MR0175 / ISO 15156 Ekşi Gaz (Sour Service), Karbon Eşdeğeri ($CE_{IIW}, P_{cm}$) ve PWHT Analizi.
            * İmzalanabilir Resmi Mühendislik Hesap Raporu (A4 Printable HTML Dossier).
            * Modern Yüksek Çözünürlüklü Uygulama İkonu.

          ---
          *Güvenlik ve Bütünlük*: Tüm paketler anti-virüs / anti-malware yanlış pozitiflerini önlemek için UPX sıkıştırmasız ve standart PE/Mach-O imzalarıyla derlenmiştir.
          EOF

          sed -i "s/__TAG__/${TAG}/g" release_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --title "ASME B31.8 Pipeline Designer $TAG" --notes-file release_notes.md
            gh release upload "$TAG" final-release/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" final-release/* --title "ASME B31.8 Pipeline Designer $TAG" --notes-file release_notes.md
          fi
